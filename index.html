:root{color-scheme:light;--ink:#142943;--muted:#52647a;--line:#dce5ee;--teal:#00665e;--gold:#e9c98c}
body{background:#f3f6fa;color:var(--ink);line-height:1.55}
header{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding-block:13px;box-shadow:0 2px 8px #1429430a}
header small{color:var(--muted)}header button{background:#f4f7fa;color:var(--ink);border:1px solid var(--line)}
main{padding-top:clamp(20px,4vw,48px)}
h1,h2,h3{line-height:1.3}
button{transition:background-color .16s,border-color .16s,box-shadow .16s}
button:hover{box-shadow:0 3px 9px #1429431a}
.campus-hero{background:#102740;border-radius:24px;border-block-end:0;box-shadow:0 24px 55px #14294323}
.campus-copy{position:relative;border-block-start:3px solid var(--gold)}
.campus-media img{object-position:center 57%}
.campus-entry{padding-inline:20px;min-height:48px;font-weight:800}
.panel,.card,details{border-color:var(--line);box-shadow:0 4px 14px #14294308}
.card{border-top:3px solid #138276}
.role{border-top-color:#bc9958;background:linear-gradient(155deg,#fff,#f4f8fb)}
.role:hover{border-color:#00877a}
.workspace-nav{background:#fff;padding:10px;border:1px solid var(--line);border-radius:13px;margin-bottom:20px}
.workspace-nav button{background:#f4f7fa;border-color:transparent}
.workspace-nav button[aria-current="page"]{background:#00665e;color:#fff}
.narrow{padding:clamp(18px,5vw,36px)}dialog{box-shadow:0 24px 70px #14294342}
th{background:#edf3f8}tbody tr:hover{background:#f6fafc}
@media(max-width:720px){.campus-hero{border-radius:17px}.campus-copy{border-block-start:0}.workspace-nav button{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){button{transition:none}}

  if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
  else if(c==='"')q=true;

 rows.forEach((r,n)=>{

  if(key==='buildings'){if(byName(db.buildings,r[0]).length){bad(T('مكرر','duplicate'));return}db.buildings.push({id:nextId('buildings'),name:r[0]})}
  else if(key==='rooms'){
   let b=byName(db.buildings,r[1]||'')[0];if(!b&&!r[1]&&db.buildings.length===1)b=db.buildings[0];
   const f=floorIndex(r[2]||'0');
   if(!b){bad(T('المبنى غير موجود','building not found'));return}
   if(f<0){bad(T('الدور غير صحيح','invalid floor'));return}
   if(db.rooms.some(o=>o.building===b.id&&o.name===r[0])){bad(T('مكرر','duplicate'));return}
   db.rooms.push({id:nextId('rooms'),name:r[0],building:b.id,floor:f})}

   if(!programsList.includes(r[1])){bad(T('برنامج غير معروف','unknown program'));return}
   if(byName(db.people,r[0]).length){bad(T('مكرر','duplicate'));return}
   db.people.push({id:nextId('people'),name:r[0],program:r[1]})}
  else if(key==='lectures'){
   const p=byName(db.people,r[1]||'')[0],rm=byName(db.rooms,r[2]||''),date=normDate(r[3]||''),time=normTime(r[4]||'');
   if(!p){bad(T('المحاضر غير موجود','lecturer not found'));return}
   if(rm.length!==1){bad(rm.length?T('اسم القاعة مكرر في أكثر من مبنى','room name is ambiguous'):T('القاعة غير موجودة','room not found'));return}
   if(!date||!time){bad(T('التاريخ أو الوقت غير صحيح','invalid date or time'));return}
   if(db.lectures.some(y=>y.date===date&&y.time===time&&(y.room===rm[0].id||y.person===p.id))){bad(T('تعارض في القاعة أو المحاضر','room or lecturer conflict'));return}
   const kd=normKindIn(r[6]);if(kd===null){bad(T('النوع غير معروف','unknown type'));return}
   db.lectures.push({id:nextId('lectures'),course:r[0],room:rm[0].id,person:p.id,date,time,kind:kd,courseEn:r[5]||''})}
  else if(key==='criteria'){
   const max=+latin(r[1]||'');
   if(!(max>=1)){bad(T('الدرجة العظمى غير صحيحة','invalid max score'));return}
   const kd=normKindIn(r[3]);if(kd===null){bad(T('النوع غير معروف','unknown type'));return}

   db.criteria.push({id:nextId('criteria'),name:r[0],max,en:r[2]||'',kind:kd})}
  added++;
 });
 return {added,errors};
}

function suggestAssign(rows,obs,count,cap){

 db.lectures.forEach(l=>{const oid=Object.prototype.hasOwnProperty.call(assignDraft,l.id)?assignDraft[l.id]:(l.observer==null?'':l.observer);if(oid===''||oid==null)return;

  pool.sort((a,b)=>(visits[vk(a)]||0)-(visits[vk(b)]||0)||(a.date+a.time<b.date+b.time?-1:1));
  const x=pool.shift();
  const free=obs.filter(a=>!busy[a.id+'|'+x.date+'|'+x.time]&&(dayLoad[a.id+'|'+x.date]||0)<cap);
  if(!free.length){skipped++;continue}

  $('asMsg').textContent=T('اقترح النظام ','The system suggested ')+r.picks.length+T(' جلسة',' session(s)')+(r.skipped?T(' · تعذّر توزيع ',' · could not place ')+r.skipped+T(' لعدم توفر متابع في موعدها',' (no free observer)'):'')+(r.picks.length?T(' · راجعيها ثم اضغطي حفظ.',' · review, then save.'):'');
 };
 $('asSave').onclick=assignSave;
}
async function assignSave(){
 const rows=assignRows().filter(x=>!x.scores&&effObs(x)!==String(x.observer==null?'':x.observer));
 const items=rows.map(x=>({lectureId:x.id,observerId:effObs(x)===''?null:(API?+effObs(x):effObs(x))}));
 const seen={};for(const l of db.lectures){const oid=Object.prototype.hasOwnProperty.call(assignDraft,l.id)?assignDraft[l.id]:(l.observer==null?'':l.observer);if(oid===''||oid==null)continue;const k=oid+'|'+l.date+'|'+l.time;if(seen[k]){toast(T('متابع واحد مسند لجلستين في نفس الموعد.','One observer is assigned to two sessions at the same time.'));return}seen[k]=1}
 try{
  if(API){items.forEach(it=>{const l=db.lectures.find(y=>y.id===it.lectureId);if(l)l.observer=it.observerId});bg('saveAssignments',{items})}
  else{items.forEach(it=>{const l=db.lectures.find(y=>y.id===it.lectureId);if(l){if(it.observerId==null)delete l.observer;else l.observer=it.observerId}});save()}
  assignDraft={};render();toast(T('تم حفظ التوزيع.','Distribution saved.'));
 }catch(err){toast(errMsg(err))}
}

let dailyDate='',lastDaily=null;
function localReport(date){
 const closed=(db.closedDays||[]).includes(date),cs={lecture:crit('lecture'),section:crit('section')},team0=teamAccounts();
 const all=db.lectures.filter(l=>l.date===date&&l.observer!=null&&l.observer!=='').map(l=>{const has=Boolean(l.scores);return {l,p:db.people.find(q=>q.id===l.person),st:!has?'pending':(approvedData(l)?'approved':'evaluated'),score:has?score(l):null,obs:team0.find(t=>t.id===l.observer)}});
 const approved=all.filter(s=>s.st==='approved').length,complete=closed||(all.length>0&&approved===all.length);
 const supervisor=['admin','dean','vice','coord'].includes(role);
 if(!supervisor&&!complete)return {date,complete:false,closed};
 const mine=role==='coord'?all.filter(s=>s.p&&s.p.program===coordinatorProgram):all;
 const base=supervisor?mine:all,minGroup=supervisor?1:3;
 const rowsSrc=supervisor?mine:(role==='observer'?all.filter(s=>s.l.observer===myId()):all.filter(s=>myLec(s.l)&&s.st==='approved'));
 const mean=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
 const stat=list=>{const done=list.filter(s=>s.score!==null);return {assigned:list.length,evaluated:done.length,approved:list.filter(s=>s.st==='approved').length,avg:done.length>=minGroup?mean(done.map(s=>s.score)):null}};
 const programs=programsList.map(p=>Object.assign(stat(base.filter(s=>progsOf(s.l).includes(p))),{name:p})).filter(p=>p.assigned>0);
 const criteria={};
 ['lecture','section'].forEach(k=>{criteria[k]=cs[k].map((c,i)=>{const v=[];base.forEach(s=>{if(s.l.kind===k||(k==='lecture'&&s.l.kind!=='section')){if(kindOf(s.l)===k&&s.l.scores&&s.l.scores[i]!=null)v.push(s.l.scores[i]/c.max*100)}});return {name:c.name,en:c.en,n:v.length,avg:v.length>=minGroup?mean(v):null}})});
 return {date,complete,closed,scope:supervisor?(role==='coord'?'program':'all'):'summary',canClose:['admin','dean','vice'].includes(role),totals:stat(base),programs,criteria,
  rows:rowsSrc.map(s=>({lectureId:s.l.id,course:s.l.course,courseEn:s.l.courseEn,kind:kindOf(s.l),time:s.l.time,room:(room(s.l)||{}).name||'',person:staffOf(s.l),personEn:'',program:progOf(s.l)||'',level:s.l.level||'',group:s.l.group||'',observer:s.obs?s.obs.name:'',status:s.st,score:s.score})).sort((a,b)=>a.time<b.time?-1:1)};
}
function dailyView(){
 if(!dailyDate)dailyDate=today();
 const asked=dailyDate;
 app.innerHTML+='<h1>'+T('تقرير اليوم','Daily report')+'</h1><div class="panel"><div class="grid">'+label(T('التاريخ','Date'),'<input type="date" id="dailyDate" value="'+esc(dailyDate)+'">')+'</div></div><div class="panel" id="dailyBody"><p class="muted">'+T('جارٍ التحميل…','Loading…')+'</p></div>';
 $('dailyDate').onchange=e=>{if(e.target.value){dailyDate=e.target.value;render()}};
 Promise.resolve().then(()=>API?api('dailyReport',{date:asked}):localReport(asked)).then(r=>{if(screen==='daily'&&asked===dailyDate&&$('dailyBody'))renderDaily(r)}).catch(err=>{if($('dailyBody'))$('dailyBody').innerHTML='<p class="err">'+esc(errMsg(err))+'</p>'});
}
function renderDaily(r){
 lastDaily=r;const body=$('dailyBody');
 if(!r.totals){body.innerHTML='<p>'+T('لم يكتمل تقرير هذا اليوم بعد. سيظهر لك بعد اعتماد كل متابعات اليوم أو إصداره من الإدارة.','This day\'s report is not complete yet. It will appear once all of the day\'s follow-ups are approved or the administration releases it.')+'</p>';return}
 const st={pending:T('لم تتم','Pending'),evaluated:T('تمت · بانتظار الاعتماد','Evaluated · awaiting approval'),approved:T('معتمد','Approved')};
 const sup=r.scope!=='summary';
 let h='<p><span class="pill '+(r.complete?'done':'')+'">'+(r.complete?T('مكتمل · متاح للجميع','Complete · available to everyone'):T('قيد الاستكمال · للإدارة فقط','In progress · administration only'))+'</span>'+(r.closed?' <small>'+T('(أُصدر يدويًا)','(released manually)')+'</small>':'')+'</p>';
 if(r.canClose)h+='<div class="actions"><button type="button" id="closeDay" '+(r.closed?'':'class="primary"')+'>'+(r.closed?T('إلغاء الإصدار','Withdraw release'):T('إصدار التقرير للجميع الآن','Release to everyone now'))+'</button></div>';
 const t=r.totals;
 h+='<div class="grid">'+[[T('جلسات موزّعة','Assigned sessions'),t.assigned],[T('تمت متابعتها','Evaluated'),t.evaluated],[T('معتمدة','Approved'),t.approved],[T('متوسط التقييم','Average score'),t.avg==null?'—':t.avg+'%']].map(([k,v])=>'<div class="card">'+k+'<b>'+v+'</b></div>').join('')+'</div>';
 if(!sup)h+='<p class="muted">'+T('تُخفى المتوسطات عندما يقل عدد الجلسات عن 3 حفاظًا على الخصوصية.','Averages are hidden for fewer than 3 sessions, to protect privacy.')+'</p>';
 if(r.programs.length)h+='<h2>'+T('حسب البرنامج','By program')+'</h2><div class="scroll"><table><thead><tr>'+[T('البرنامج','Program'),T('موزّعة','Assigned'),T('تمت','Evaluated'),T('معتمدة','Approved'),T('المتوسط','Average')].map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'+r.programs.map(p=>'<tr><td>'+esc(display(p.name))+'</td><td>'+p.assigned+'</td><td>'+p.evaluated+'</td><td>'+p.approved+'</td><td>'+(p.avg==null?'—':p.avg+'%')+'</td></tr>').join('')+'</tbody></table></div>';
 for(const kd of ['lecture','section']){const cs=(r.criteria&&r.criteria[kd])||[];if(!cs.length||!cs.some(c=>c.n))continue;
  h+='<h2>'+T('متوسط البنود · ','Criteria averages · ')+kindName(kd)+'</h2>'+cs.map(c=>'<div class="bar"><span>'+esc(lang==='en'&&c.en?c.en:c.name)+'</span><meter max="100" value="'+(c.avg||0)+'"></meter><b>'+(c.avg==null?'—':c.avg+'%')+'</b></div>').join('')}
 if(r.rows.length)h+='<h2>'+(sup?T('جلسات اليوم','Today\'s sessions'):T('جلساتك','Your sessions'))+'</h2><div class="scroll"><table><thead><tr>'+[T('الوقت','Time'),T('الجلسة','Session'),T('المحاضر','Lecturer'),T('القاعة','Room'),T('البرنامج','Program'),T('المتابع','Observer'),T('الحالة','Status'),T('التقييم','Score')].map(k=>'<th>'+k+'</th>').join('')+'</tr></thead><tbody>'
  +r.rows.map(x=>'<tr><td>'+esc(x.time)+'</td><td>'+esc(display(x.course))+' <span class="pill kind '+x.kind+'">'+kindName(x.kind)+'</span></td><td>'+esc(display(x.person))+'</td><td>'+esc(x.room)+'</td><td>'+esc(display(x.program))+'</td><td>'+esc(display(x.observer))+'</td><td>'+esc(st[x.status])+'</td><td>'+(x.score==null?'—':x.score+'%')+'</td></tr>').join('')+'</tbody></table></div>';
 if(r.rows.length)h+='<div class="actions">'+button(T('تنزيل Word','Download Word'),"downloadDaily('docx')",'primary')+button(T('تنزيل CSV','Download CSV'),"downloadDaily('csv')")+'</div>';
 body.innerHTML=h;
 const cb=$('closeDay');if(cb)cb.onclick=async()=>{try{if(API)await api('closeDay',{date:r.date,closed:!r.closed});else{db.closedDays=db.closedDays||[];const i=db.closedDays.indexOf(r.date);if(r.closed&&i>=0)db.closedDays.splice(i,1);else if(!r.closed&&i<0)db.closedDays.push(r.date);save()}render()}catch(err){toast(errMsg(err))}};
}
function downloadDaily(type){
 const r=lastDaily;if(!r||!r.rows)return;
 const head=[T('الوقت','Time'),T('الجلسة','Session'),T('النوع','Type'),T('المحاضر','Lecturer'),T('القاعة','Room'),T('البرنامج','Program'),T('المتابع','Observer'),T('الحالة','Status'),T('التقييم','Score')];
 const stt={pending:T('لم تتم','Pending'),evaluated:T('تمت · بانتظار الاعتماد','Evaluated'),approved:T('معتمد','Approved')};
 const data=[head,...r.rows.map(x=>[x.time,display(x.course),kindName(x.kind),display(x.person),x.room,display(x.program),display(x.observer),stt[x.status],x.score==null?'':x.score+'%'])];
 let blob;
 if(type==='csv'){const q=v=>{let t=String(v==null?'':v);if(/^\s*[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};blob=new Blob(['﻿',data.map(row=>row.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'})}
 else{
  const para=(v,b)=>'<w:p><w:pPr>'+(lang==='ar'?'<w:bidi/>':'')+'</w:pPr><w:r><w:rPr>'+(lang==='ar'?'<w:rtl/>':'')+(b?'<w:b/><w:bCs/>':'')+'</w:rPr><w:t xml:space="preserve">'+esc(String(v==null?'':v).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''))+'</w:t></w:r></w:p>';
  const content=para(T(ar,en),true)+para(T('تقرير متابعة اليوم · ','Daily follow-up report · ')+r.date,true)+para(T('الحالة: ','Status: ')+(r.complete?T('مكتمل','Complete'):T('قيد الاستكمال','In progress')))+r.rows.map(x=>para(display(x.course)+' · '+kindName(x.kind),true)+data[0].map((k,i)=>i>2?para(k+' · '+(data[1+r.rows.indexOf(x)][i]||'—')):'').join('')).join('');
  blob=new Blob(zip({'[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>','_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>','word/document.xml':'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+content+'</w:body></w:document>'}),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
 }
 saveBlob(blob,'daily-report-'+r.date+'.'+type);
}
